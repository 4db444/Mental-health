# Local stack: Airflow orchestrates the pipeline, Streamlit serves the results.
# The pipeline itself lives in src/pipeline and is called with `python -m src.pipeline`.
x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: mental-health-airflow:local
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_local_jwt_secret}
    PROJECT_ROOT: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
  volumes:
    - ./dags:/opt/airflow/dags
    # Named volume, not ./logs: Docker seeds it with the image's /opt/airflow/logs
    # (airflow:0, mode 775), so the dag processor can always write its parse logs
    # whatever AIRFLOW_UID is. A host bind mount inherits host ownership instead,
    # and Airflow 3 dies at startup if it cannot open those logs.
    - airflow-logs:/opt/airflow/logs
    - ./:/opt/airflow/project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow standalone"
    ports:
      - "8080:8080"
    restart: always

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    image: mental-health-streamlit:local
    environment:
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - ./:/app
    ports:
      - "8501:8501"
    restart: always

volumes:
  postgres-db-volume:
  airflow-logs:
