[project]
name = "mental-health"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[dependency-groups]
dev = [
    "astor>=0.8.1",
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "nb-mypy>=1.0.1",
    "nbconvert>=7.17.2",
    "nbqa>=1.10.0",
]

